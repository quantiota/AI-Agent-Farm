config_version	1.2
snapshot_root	/backup/redundancy/
cmd_cp	/bin/cp
cmd_rm	/bin/rm
cmd_rsync	/usr/bin/rsync
cmd_ssh	/usr/bin/ssh
cmd_logger	/usr/bin/logger
cmd_du	/usr/bin/du
cmd_rsnapshot_diff	/usr/bin/rsnapshot-diff
retain	daily	7
retain	weekly	4
retain	monthly	6
verbose	2
loglevel	3
logfile	/var/log/rsnapshot-redundancy.log
lockfile	/var/run/rsnapshot-redundancy.pid
rsync_short_args	-a
rsync_long_args	--delete --numeric-ids --relative --delete-excluded
ssh_args	-i /root/.ssh/redundancy -o StrictHostKeyChecking=accept-new
backup	root@192.168.1.113:/hourly.0/	microserver01/
