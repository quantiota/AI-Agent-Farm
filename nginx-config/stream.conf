# stream.conf — the Farm's single entry from the Internet, on the nginx server (Dell R210 II).
# Reads the name each TLS connection asks for (SNI) without decrypting it, and forwards the
# connection to the node that owns the name: every node keeps its own certificates.
#
# Install on the nginx server:
#   1. copy to /etc/nginx/streams-enabled/stream.conf
#   2. add ONE line at the top level of /etc/nginx/nginx.conf (outside http {}):
#          include /etc/nginx/streams-enabled/*.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. forward the router's port 443 to the nginx server's local IP address
#
# Adding a node: add its line to the map, then step 3.

stream {
    map $ssl_preread_server_name $backend {
        ~\.microserver01\.net$   192.168.1.113:443;
        ~\.microserver02\.net$   192.168.1.253:443;
        ~\.microserver03\.net$   192.168.1.157:443;
        ~\.microserver04\.net$   192.168.1.152:443;
        ~\.microserver05\.net$   192.168.1.105:443;
        ~\.microserver06\.net$   192.168.1.60:443;
        ~\.microserver07\.net$   192.168.1.76:443;
        ~\.microserver08\.net$   192.168.1.247:443;
        ~\.microserver09\.net$   192.168.1.23:443;
        ~\.microserver10\.net$   192.168.1.173:443;
        ~\.microserver11\.net$   192.168.1.51:443;
        ~\.microserver12\.net$   192.168.1.136:443;
        ~\.microserver13\.net$   192.168.1.83:443;
        ~\.microserver14\.net$   192.168.1.133:443;
        ~\.microserver15\.net$   192.168.1.250:443;
        ~\.microserver16\.net$   192.168.1.154:443;

        # the Matrix homeserver (Chapter 14 of the book)
        ~\.microserver\.network$   192.168.1.165:443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
