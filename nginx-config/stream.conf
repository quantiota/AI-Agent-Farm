# SNI router (GPU server). Routes each lab's domain to its microserver by TLS SNI,
# terminating nothing; each lab terminates its own cert. Install: see README.md.
# Set <tld> and each lab's real IP below (.19 is the GPU server).

stream {
    map $ssl_preread_server_name $backend {
        ~\.microserver01\.tld$   192.168.1.15:443;
        ~\.microserver02\.tld$   192.168.1.16:443;
        ~\.microserver03\.tld$   192.168.1.17:443;
        ~\.microserver04\.tld$   192.168.1.18:443;
        ~\.microserver05\.tld$   192.168.1.20:443;
        ~\.microserver06\.tld$   192.168.1.21:443;
        ~\.microserver07\.tld$   192.168.1.22:443;
        ~\.microserver08\.tld$   192.168.1.23:443;

        default                  127.0.0.1:8443;   # local hub.gpuserver.tld services
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
